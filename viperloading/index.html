<!DOCTYPE html>
<html>
    <header>
        <link rel="stylesheet" href="assets/css/all.min.css">
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/fonts.css">
        <title>ND Loading Screen</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script type="text/javascript" src="assets/scripts/all.min.js"></script>
    </header>
    <body>
        <video autoplay muted loop class="bg-video">
            <source src="assets/media/background.mp4" type="video/mp4">
        </video>
        <div class="overlay">
            <div class="loader">
                <div class="progress-bar-container">
                    <div class="progress-bar"></div>
                </div>
            </div>
            <div class="socials"></div>
            <div class="cornercontainer">
                <div class="top">
                    <div class="left">
                        <p class="title">ViperPvP</p>
                        <p class="state" id="clients">0/0</p>
                    </div>
                    <div class="right">
                        <img class="logo" src="assets/media/logo.png">
                    </div>
                </div>
                <div class="sounds">
                    <div class="switch">
                        <label class="form-switch">
                            <input type="checkbox" id="sounds">
                            <i></i>
                        </label>
                        <span class="left">Start</span>
                        <span class="right">Stop</span>
                    </div>
                    <div class="icon"><i class="fas fa-volume"></i></div>
                </div>
            </div>
            <div class="container">
                <div class="hideoverlay">
                    <div class="bind"></div>
                    PLEIN ECRAN IMAGE
                </div>
            </div>
        </div>
        
        <script src="assets/scripts/config.js" type="text/javascript"></script>
        <script src="assets/scripts/main.js" type="text/javascript"></script>
        <audio id="music" autoplay>
            <source src="" tyle="audio/mpeg">
        </audio>
    </body>
</html>
